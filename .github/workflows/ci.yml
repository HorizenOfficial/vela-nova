name: CI Nova

on:
  push:
    branches: [ main, dev ]
    tags:
      - 'v*'       # triggers release job on any tag starting with 'v'

  pull_request:
    branches: [ main, dev ]

permissions:
  contents: write   # needed for creating releases
  packages: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      # Configure Git to use GITHUB_TOKEN for private modules
      - name: Configure Git for private modules
        run: |
          go env -w GOPRIVATE=github.com/HorizenOfficial/*
          git config --global url."https://${{ secrets.GH_PAT }}:@github.com/".insteadOf "https://github.com/"

      # Install Go dependencies
      - name: Download Go dependencies
        run: go mod download
        working-directory: runtime/wasm-go

      # Install TinyGo for WASM module
      - name: Install TinyGo
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo_0.39.0_amd64.deb
          sudo dpkg -i tinygo_0.39.0_amd64.deb

      # Build the Go project
      - name: Build Go project
        run:  go build ./...
        working-directory: runtime/wasm-go

      # Build WASM module
      - name: Build WASM module
        run: make build
        working-directory: runtime/wasm-go

      # Run WASM module tests
      - name: Run WASM module tests
        run: go test -v ./...
        working-directory: runtime/wasm-go

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Configure Go for private modules
        run: |
          go env -w GOPRIVATE=github.com/HorizenOfficial/*
          git config --global url."https://${{ secrets.GH_PAT }}:@github.com/".insteadOf "https://github.com/"

      - name: Install TinyGo
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo_0.39.0_amd64.deb
          sudo dpkg -i tinygo_0.39.0_amd64.deb

      - name: Build production WASM module
        run: make production_build
        working-directory: runtime/wasm-go

      - name: Create GitHub Release with WASM
        uses: softprops/action-gh-release@v2
        with:
          files: runtime/wasm-go/production_build/payment_app.wasm
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

